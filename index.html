<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>EVOLVING AQUARIUM</title>
<style>
  :root{
    --bg:#05070b;
    --fg:#eef3ff;
    --muted:#8d97aa;
    --panel:rgba(10,14,22,.72);
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{
    position:fixed;left:18px;top:56px;z-index:10;
    width:min(320px,calc(100vw - 36px));
    padding:14px 14px 12px;
    border:1px solid var(--line);
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:14px;
  }
  h1{font-size:14px;letter-spacing:.16em;margin:0 0 10px;font-weight:700}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11px;color:var(--muted)}
  .stats b{display:block;color:var(--fg);font-size:17px;font-weight:600;letter-spacing:.02em}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--fg);padding:8px 10px;border-radius:10px;font-size:11px;cursor:pointer
  }
  button:hover{background:rgba(255,255,255,.1)}
  .hint{margin-top:10px;font-size:10px;line-height:1.5;color:var(--muted)}
  #legend{
    position:fixed;right:18px;bottom:18px;z-index:10;
    padding:10px 12px;border:1px solid var(--line);background:rgba(10,14,22,.62);
    backdrop-filter:blur(12px);border-radius:12px;font-size:10px;color:var(--muted)
  }
  #legend span{display:inline-flex;align-items:center;margin-right:10px}
  i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;margin-right:5px;opacity:.8}
  @media (max-width:680px){
    #ui{left:10px;top:48px}
    #legend{right:10px;bottom:10px;max-width:70vw}
  }

  #collectionPanel{
    position:fixed;right:18px;top:18px;z-index:20;
    width:min(360px,calc(100vw - 36px));max-height:72vh;
    padding:14px;border:1px solid var(--line);
    background:rgba(10,14,22,.82);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-radius:14px;
    display:none;overflow:auto;
  }
  #collectionPanel.open{display:block}
  #collectionHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  #collectionHeader h2{font-size:12px;letter-spacing:.15em;margin:0}
  #collectionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .specimen{
    border:1px solid var(--line);border-radius:10px;padding:6px;
    background:rgba(255,255,255,.035);cursor:pointer;min-height:96px
  }
  .specimen canvas{width:100%;aspect-ratio:1/1;border-radius:7px;background:#05070b}
  .specimen .meta{font-size:9px;color:var(--muted);line-height:1.45;margin-top:5px}
  #specimenDetail{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:10px;color:var(--muted);line-height:1.6
  }
  #specimenDetail b{color:var(--fg)}
  #captureToast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    z-index:30;padding:9px 13px;border-radius:999px;
    background:rgba(10,14,22,.9);border:1px solid var(--line);
    font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s
  }
  #captureToast.show{opacity:1}
  @media (max-width:680px){
    #collectionPanel{right:10px;top:auto;bottom:10px;max-height:60vh}
  }

  #lassoModeBtn.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
  .deleteSpecimen{
    margin-top:6px;width:100%;padding:6px 8px;font-size:9px;
    border-color:rgba(255,120,120,.25);color:#ffb0b0
  }

  .groupSpecimen{border-color:rgba(255,255,255,.24)}
  .groupSpecimen .meta{color:#d7deec}

  /* COLLECTION UI v2 */
  #collectionPanel{
    width:min(760px,calc(100vw - 36px));
    max-height:82vh;
  }
  #collectionGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:10px;
  }
  .specimen{
    aspect-ratio:1/1;
    position:relative;
    padding:0;
    overflow:hidden;
    min-height:0;
    border-radius:12px;
  }
  .specimen canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    aspect-ratio:1/1;
    border-radius:0;
  }
  .specimen .meta{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:22px 8px 7px;
    margin:0;
    background:linear-gradient(transparent,rgba(4,7,12,.92));
    color:#e8edf7;
    pointer-events:none;
  }
  .specimen .deleteSpecimen{
    position:absolute;
    top:6px;
    right:6px;
    z-index:3;
    width:auto;
    margin:0;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(5,7,11,.78);
  }

  #specimenModal{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  #specimenModal.open{display:flex}
  #specimenModalCard{
    width:min(920px,96vw);
    max-height:92vh;
    overflow:auto;
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    background:rgba(7,11,18,.96);
    box-shadow:0 30px 90px rgba(0,0,0,.45);
    padding:16px;
  }
  #specimenModalHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  #specimenModalTitle{
    font-size:15px;
    letter-spacing:.12em;
    margin:0;
  }
  #specimenModalBody{
    display:grid;
    grid-template-columns:minmax(280px,1.25fr) minmax(260px,.75fr);
    gap:16px;
  }
  #largeSpecimenPreview{
    width:100%;
    aspect-ratio:1/1;
    background:#05070b;
    border:1px solid var(--line);
    border-radius:14px;
  }
  #radarCanvas{
    width:100%;
    aspect-ratio:1/1;
    background:rgba(255,255,255,.02);
    border:1px solid var(--line);
    border-radius:14px;
  }
  #modalStats{
    margin-top:10px;
    font-size:11px;
    color:var(--muted);
    line-height:1.65;
  }
  #modalStats b{color:var(--fg)}
  @media (max-width:760px){
    #collectionPanel{width:calc(100vw - 20px);right:10px}
    #collectionGrid{grid-template-columns:repeat(2,1fr)}
    #specimenModal{padding:10px}
    #specimenModalBody{grid-template-columns:1fr}
  }


  #uiToggle{
    position:fixed;left:18px;top:18px;z-index:40;
    appearance:none;border:1px solid rgba(255,255,255,.16);
    background:rgba(10,14,22,.72);color:#eef3ff;
    padding:7px 10px;border-radius:10px;font-size:10px;
    letter-spacing:.08em;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  #ui.ui-hidden{display:none}
  body.ui-off #uiToggle{opacity:.55}

.volumeControl{display:flex;align-items:center;gap:7px;margin-top:8px;color:#9aa5b7;font-size:9px;letter-spacing:.06em}
.volumeControl input{width:112px;cursor:pointer}
.volumeControl b{min-width:20px;color:#eef3ff;font-size:10px;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="uiToggle" aria-label="UI表示切替">HIDE UI</button>

<div id="ui">
  <h1>EVOLVING AQUARIUM</h1>
  <div class="stats">
    <div>POPULATION<b id="pop">0</b></div>
    <div>GENERATION<b id="gen">0</b></div>
    <div>FOOD<b id="food">0</b></div>
    <div>MUTATIONS<b id="mut">0</b></div><div>MUSIC PHASE<b id="phase">0</b></div><div>PREDATORS<b id="pred">0</b></div><div>WATER FLOW<b id="flowStat">CALM</b></div>
  </div>
  <div class="row">
    <button id="feedBtn">ADD FOOD</button>
    <button id="burstBtn">MUTATE</button>
    <button id="resetBtn">RESET</button><button id="soundBtn">START BGM</button><button id="collectionBtn">COLLECTION 0</button><button id="lassoModeBtn">LASSO CAPTURE</button>
  </div>
  <div class="hint" style="display:none"></div>
</div>

<div id="collectionPanel">
  <div id="collectionHeader">
    <h2>SPECIMEN COLLECTION</h2>
    <button id="closeCollection">CLOSE</button>
  </div>
  <div id="collectionGrid"></div>
  <div id="specimenDetail" style="display:none"></div>
</div>
<div id="captureToast">CAPTURED</div>

<div id="specimenModal" aria-hidden="true">
  <div id="specimenModalCard">
    <div id="specimenModalHead">
      <h3 id="specimenModalTitle">SPECIMEN</h3>
      <button id="closeSpecimenModal">CLOSE</button>
    </div>
    <div id="specimenModalBody">
      <canvas id="largeSpecimenPreview"></canvas>
      <div>
        <canvas id="radarCanvas"></canvas>
        <div id="modalStats"></div>
      </div>
    </div>
  </div>
</div>


<script>
window.addEventListener('error',(e)=>{
  const ui=document.getElementById('ui');
  if(ui && !document.getElementById('runtimeError')){
    const d=document.createElement('div');
    d.id='runtimeError';
    d.style.cssText='margin-top:8px;padding:7px;border:1px solid rgba(255,100,100,.35);border-radius:8px;color:#ffb0b0;font-size:10px;line-height:1.4';
    d.textContent='RUNTIME ERROR: '+(e.message||'unknown error');
    ui.appendChild(d);
  }
});
(() => {
  let bgmVolume=.62;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });
  let W=innerWidth, H=innerHeight, DPR=Math.min(devicePixelRatio||1,2);
  let creatures=[], foods=[], particles=[], predators=[];
  let collection=[];
  const COLLECTION_KEY='evolvingAquariumCollectionV1';
  let mutationCount=0, maxGeneration=0, time=0;
  let flowEvent={
    active:false,
    timer:0,
    duration:0,
    cooldown:2000,
    angle:0,
    strength:0
  };
  let pointer={x:W/2,y:H/2,down:false,px:W/2,py:H/2,vx:0,vy:0};
  let lassoMode=false, lassoActive=false, lassoPoints=[];

  const SHAPES=['circle','square','triangle','line','membrane'];
  const palette=[
    [255,92,120],[70,211,255],[255,219,88],[155,111,255],
    [88,244,171],[255,142,77],[240,240,246]
  ];

  function resize(){
    W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',resize); resize();

  const rand=(a=1,b=0)=>Math.random()*(a-b)+b;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const choice=a=>a[(Math.random()*a.length)|0];

  function makeGene(base=null){
    const g = base ? JSON.parse(JSON.stringify(base)) : {
      blocks: [],
      hueShift: rand(-18,18),
      metabolism: rand(.8,1.25),
      curiosity: 3,
      sociability: 3,
      speed: 3
    };
    if(!base){
      const n=3+((Math.random()*4)|0);
      for(let i=0;i<n;i++) g.blocks.push(newBlock(i));
    }
    return refreshTraits(g);
  }

  function newBlock(i=0){
    return {
      type: choice(SHAPES),
      x: rand(-18,18)+(i?rand(-8,8):0),
      y: rand(-18,18),
      s: rand(5,15),
      r: rand(-Math.PI,Math.PI),
      color: choice(palette).slice(),
      alpha: rand(.45,1)
    };
  }


  function colorAffinity(rgb){
    // Palette semantics:
    // red/orange -> SPEED, yellow -> CURIOSITY, green -> SOCIABILITY
    // cyan/blue -> stability, purple -> mutation/complexity, white -> neutral
    const [r,g,b]=rgb||[255,255,255];
    const refs={
      speed:[[255,92,120],[255,142,77]],
      curiosity:[[255,219,88]],
      sociability:[[88,244,171]],
      stable:[[70,211,255]],
      mutation:[[155,111,255]],
      neutral:[[240,240,246]]
    };
    const sim=(c,t)=>{
      const d=Math.hypot(c[0]-t[0],c[1]-t[1],c[2]-t[2]);
      return clamp(1-d/441.7,0,1);
    };
    const best=(arr)=>Math.max(...arr.map(t=>sim([r,g,b],t)));
    return {
      speed:best(refs.speed),
      curiosity:best(refs.curiosity),
      sociability:best(refs.sociability),
      stable:best(refs.stable),
      mutation:best(refs.mutation),
      neutral:best(refs.neutral)
    };
  }

  function calculateTraits(gene){
    const blocks=gene?.blocks||[];
    if(!blocks.length) return {speed:3,curiosity:3,sociability:3};

    let speed=0.35, curiosity=0.35, sociability=0.35;
    let radial=0, asymX=0, asymY=0, maxR=1;

    for(const b of blocks){
      const rr=Math.hypot(b.x||0,b.y||0);
      radial+=rr;
      asymX+=(b.x||0)*(b.s||1);
      asymY+=(b.y||0)*(b.s||1);
      maxR=Math.max(maxR,rr+(b.s||0));

      // Shape semantics
      if(b.type==='triangle'){ speed+=0.26; curiosity+=0.05; }
      else if(b.type==='line'){ speed+=0.08; curiosity+=0.24; sociability+=0.08; }
      else if(b.type==='circle'){ speed+=0.04; curiosity+=0.14; sociability+=0.14; }
      else if(b.type==='square'){ speed-=0.035; sociability+=0.07; }
      else if(b.type==='membrane'){ curiosity+=0.08; sociability+=0.25; }

      // Color semantics
      const ca=colorAffinity(b.color);
      speed += ca.speed*0.17;
      curiosity += ca.curiosity*0.19;
      sociability += ca.sociability*0.19;

      // Blue/cyan dampens speed slightly and favors stability/social persistence
      speed -= ca.stable*0.035;
      sociability += ca.stable*0.045;

      // Purple increases exploratory unpredictability
      curiosity += ca.mutation*0.075;
    }

    const n=blocks.length;
    radial/=n;

    // Placement semantics:
    // outward-spreading structures explore more
    const spread=clamp(radial/28,0,1.5);
    curiosity += spread*0.22;

    // asymmetry contributes to dynamic / fast movement
    const mass=blocks.reduce((s,b)=>s+(b.s||1),0)||1;
    const asym=clamp(Math.hypot(asymX,asymY)/(mass*maxR),0,1);
    speed += asym*0.22;

    // radial / balanced arrangements support sociability
    const balance=1-asym;
    sociability += balance*0.15;

    // Many connectors / elements increase social complexity but excessive mass reduces speed.
    sociability += clamp((n-3)/9,0,1)*0.17;
    speed -= clamp((n-7)/10,0,1)*0.10;

    // normalize to the same conceptual range used by radar chart: roughly 0.2–2.0
    const normalize=v=>{
      const bounded=clamp(v,0.2,2.0);
      return 1 + ((bounded-0.2)/(2.0-0.2))*4;
    };

    return {
      speed:normalize(speed),
      curiosity:normalize(curiosity),
      sociability:normalize(sociability)
    };
  }

  function refreshTraits(gene){
    const t=calculateTraits(gene);
    gene.speed=t.speed;
    gene.curiosity=t.curiosity;
    gene.sociability=t.sociability;
    return gene;
  }

  function mutateGene(g, strength=1){
    const n=JSON.parse(JSON.stringify(g));
    const ops=['add','remove','move','resize','recolor','type','swap'];
    const count=1+((Math.random()*(2+strength))|0);
    for(let k=0;k<count;k++){
      const op=choice(ops);
      if(op==='add' && n.blocks.length<12) n.blocks.push(newBlock());
      else if(op==='remove' && n.blocks.length>2) n.blocks.splice((Math.random()*n.blocks.length)|0,1);
      else if(op==='move'){
        const b=choice(n.blocks); b.x+=rand(-10,10)*strength; b.y+=rand(-10,10)*strength;
      } else if(op==='resize'){
        const b=choice(n.blocks); b.s=clamp(b.s*rand(1.35,.72),3,23);
      } else if(op==='recolor'){
        const b=choice(n.blocks); b.color=choice(palette).slice(); b.alpha=rand(.45,1);
      } else if(op==='type'){
        choice(n.blocks).type=choice(SHAPES);
      } else if(op==='swap' && n.blocks.length>1){
        const a=(Math.random()*n.blocks.length)|0, b=(Math.random()*n.blocks.length)|0;
        [n.blocks[a].x,n.blocks[b].x]=[n.blocks[b].x,n.blocks[a].x];
        [n.blocks[a].y,n.blocks[b].y]=[n.blocks[b].y,n.blocks[a].y];
      }
    }
    n.hueShift += rand(-8,8);
    n.metabolism=clamp(n.metabolism+rand(-.08,.08),.55,1.6);
    refreshTraits(n);
    mutationCount++;
    return n;
  }

  function crossGenes(a,b){
    const child=makeGene();
    child.blocks=[];
    const pool=[...a.blocks,...b.blocks];
    const target=clamp(Math.round((a.blocks.length+b.blocks.length)/2+rand(-1.5,1.5)),2,12);
    for(let i=0;i<target;i++) child.blocks.push(JSON.parse(JSON.stringify(choice(pool))));
    child.metabolism=(a.metabolism+b.metabolism)/2;
    refreshTraits(child);
    return mutateGene(child,.65);
  }

  function makeCreature(x=rand(W),y=rand(H),gene=null,generation=0){
    return {
      x,y,vx:rand(-.7,.7),vy:rand(-.7,.7),
      angle:rand(Math.PI*2), spin:rand(-.006,.006),
      energy:rand(55,95), age:0, generation,
      gene:refreshTraits(gene||makeGene()),
      cooldown:rand(0,300), pulse:rand(Math.PI*2),
      phaseA:rand(Math.PI*2), phaseB:rand(Math.PI*2),
      turnBias:rand(-1,1), wobbleSeed:rand(1000),
      id:Math.random().toString(36).slice(2)
    };
  }

  function addFood(x=rand(W),y=rand(H),n=1){
    for(let i=0;i<n;i++){
      foods.push({x:x+rand(-18,18),y:y+rand(-18,18),r:rand(1.5,3.8),life:1});
    }
  }



  function pointInPolygon(x,y,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i].x, yi=poly[i].y;
      const xj=poly[j].x, yj=poly[j].y;
      const intersect=((yi>y)!=(yj>y)) &&
        (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi);
      if(intersect) inside=!inside;
    }
    return inside;
  }

  function finishLassoCapture(){
    if(lassoPoints.length<3){ lassoPoints=[]; lassoActive=false; return; }

    const captured=creatures.filter(c=>pointInPolygon(c.x,c.y,lassoPoints));
    if(captured.length){
      captureGroup(captured);
      const toast=document.getElementById('captureToast');
      toast.textContent='GROUP OF '+captured.length+' CAPTURED';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),1100);
    }

    lassoPoints=[];
    lassoActive=false;
  }

  function saveCollection(){
    try{ localStorage.setItem(COLLECTION_KEY,JSON.stringify(collection)); }catch(e){}
    updateCollectionUI();
  }

  function loadCollection(){
    try{
      const saved=JSON.parse(localStorage.getItem(COLLECTION_KEY)||'[]');
      if(Array.isArray(saved)){
        collection=saved;
        for(const s of collection){
          if(s.type==='group' && Array.isArray(s.members)){
            for(const m of s.members){
              if(m.gene) refreshTraits(m.gene);
            }
          }else if(s.gene){
            refreshTraits(s.gene);
          }
        }
      }
    }catch(e){ collection=[]; }
    updateCollectionUI();
  }

  function creatureRadius(c){
    let r=20;
    for(const b of c.gene.blocks){
      r=Math.max(r,Math.hypot(b.x,b.y)+b.s*1.6);
    }
    return r*clamp(.78+c.energy/180,.78,1.45);
  }

  function findCreatureAt(x,y){
    let best=null,bd=Infinity;
    for(const c of creatures){
      const d=Math.hypot(c.x-x,c.y-y);
      const hit=Math.max(24,creatureRadius(c));
      if(d<hit && d<bd){best=c;bd=d;}
    }
    return best;
  }

  function captureCreature(c,showToast=true){
    if(!c) return;
    const specimen={
      capturedAt:new Date().toISOString(),
      generation:c.generation,
      energy:Math.round(c.energy),
      age:Math.round(c.age),
      gene:JSON.parse(JSON.stringify(c.gene)),
      id:c.id,
      label:'SPECIMEN-'+String(collection.length+1).padStart(3,'0')
    };
    collection.unshift(specimen);
    saveCollection();
    if(showToast){
      const toast=document.getElementById('captureToast');
      toast.textContent=specimen.label+' CAPTURED';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),900);
    }
    burst(c.x,c.y,[255,255,255],26);
  }


  function captureGroup(group){
    if(!group || !group.length) return;

    const cx=group.reduce((sum,c)=>sum+c.x,0)/group.length;
    const cy=group.reduce((sum,c)=>sum+c.y,0)/group.length;

    const members=group.map(c=>({
      dx:c.x-cx,
      dy:c.y-cy,
      generation:c.generation,
      energy:Math.round(c.energy),
      age:Math.round(c.age),
      gene:JSON.parse(JSON.stringify(c.gene)),
      id:c.id,
      angle:c.angle||0
    }));

    const specimen={
      type:'group',
      capturedAt:new Date().toISOString(),
      members,
      generation:Math.max(...group.map(c=>c.generation)),
      minGeneration:Math.min(...group.map(c=>c.generation)),
      label:'COLONY-'+String(collection.length+1).padStart(3,'0')
    };

    collection.unshift(specimen);
    saveCollection();

    for(const c of group) burst(c.x,c.y,[255,255,255],8);
  }

  function drawGenePreview(g, gene, generation=0){
    const blocks=gene.blocks||[];

    // connectors
    g.strokeStyle='rgba(255,255,255,.12)';
    g.lineWidth=1;
    for(let i=1;i<blocks.length;i++){
      g.beginPath();
      g.moveTo(blocks[i-1].x,blocks[i-1].y);
      g.lineTo(blocks[i].x,blocks[i].y);
      g.stroke();
    }

    for(const b of blocks){
      g.save();
      g.translate(b.x,b.y);
      g.rotate(b.r||0);

      const [r,gg,bb]=b.color||[255,255,255];
      const alt=palette[(Math.abs(Math.floor((b.x||0)+(b.y||0)+(b.s||0))))%palette.length];

      let fill;
      if(generation>=8){
        const gr=g.createLinearGradient(-b.s,-b.s,b.s,b.s);
        gr.addColorStop(0,`rgba(${r},${gg},${bb},${b.alpha??1})`);
        gr.addColorStop(1,`rgba(${alt[0]},${alt[1]},${alt[2]},${b.alpha??1})`);
        fill=gr;
      }else{
        fill=`rgba(${r},${gg},${bb},${b.alpha??1})`;
      }

      g.fillStyle=fill;
      g.strokeStyle=fill;
      g.lineWidth=1.2;

      if(b.type==='circle'){
        g.beginPath();g.arc(0,0,b.s,0,Math.PI*2);g.fill();
      }else if(b.type==='square'){
        g.fillRect(-b.s,-b.s,b.s*2,b.s*2);
      }else if(b.type==='triangle'){
        g.beginPath();g.moveTo(b.s,0);g.lineTo(-b.s*.75,b.s*.75);g.lineTo(-b.s*.75,-b.s*.75);g.closePath();g.fill();
      }else if(b.type==='line'){
        g.lineWidth=Math.max(2,b.s*.35);g.beginPath();g.moveTo(-b.s*1.25,0);g.lineTo(b.s*1.25,0);g.stroke();
      }else{
        g.globalAlpha=.6;
        g.beginPath();g.ellipse(0,0,b.s*1.35,b.s*.72,0,0,Math.PI*2);g.fill();
      }
      g.restore();
    }
  }

  function drawSpecimenPreview(canvas,s){
    const dpr=Math.min(devicePixelRatio||1,2);
    const size=120;
    canvas.width=size*dpr;
    canvas.height=size*dpr;

    const g=canvas.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#05070b';
    g.fillRect(0,0,size,size);
    g.save();
    g.translate(size/2,size/2);

    if(s.type==='group' && Array.isArray(s.members)){
      let extent=36;
      for(const m of s.members){
        let mr=20;
        for(const b of (m.gene.blocks||[])){
          mr=Math.max(mr,Math.hypot(b.x,b.y)+b.s*1.6);
        }
        extent=Math.max(extent,Math.hypot(m.dx,m.dy)+mr);
      }
      const sc=Math.min(1.3,48/extent);
      g.scale(sc,sc);

      for(const m of s.members){
        g.save();
        g.translate(m.dx,m.dy);
        g.rotate(m.angle||0);
        drawGenePreview(g,m.gene,m.generation||0);
        g.restore();
      }
    }else{
      const blocks=s.gene?.blocks||[];
      let extent=28;
      for(const b of blocks) extent=Math.max(extent,Math.hypot(b.x,b.y)+b.s*1.6);
      const sc=Math.min(1.5,42/extent);
      g.scale(sc,sc);
      drawGenePreview(g,s.gene||{blocks:[]},s.generation||0);
    }

    g.restore();
  }

  function getSpecimenTraits(s){
    if(s.type==='group' && Array.isArray(s.members) && s.members.length){
      const avg=(key)=>s.members.reduce((sum,m)=>sum+(Number(m.gene?.[key])||0),0)/s.members.length;
      return {
        speed:avg('speed'),
        curiosity:avg('curiosity'),
        sociability:avg('sociability')
      };
    }
    return {
      speed:Number(s.gene?.speed)||0,
      curiosity:Number(s.gene?.curiosity)||0,
      sociability:Number(s.gene?.sociability)||0
    };
  }

  function drawRadarChart(s){
    const canvas=document.getElementById('radarCanvas');
    if(!canvas) return;
    const size=320;
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=size*dpr;
    canvas.height=size*dpr;

    const g=canvas.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,size,size);

    const traits=getSpecimenTraits(s);
    const values=[
      clamp((traits.speed-1)/4,0,1),
      clamp((traits.curiosity-1)/4,0,1),
      clamp((traits.sociability-1)/4,0,1)
    ];
    const labels=['SPEED','CURIOSITY','SOCIABILITY'];
    const raw=[traits.speed,traits.curiosity,traits.sociability];

    const cx=size/2, cy=size/2+8, R=105;
    const angles=[-Math.PI/2, Math.PI/2+Math.PI/3, Math.PI/2-Math.PI/3];

    g.lineWidth=1;
    for(let ring=1;ring<=4;ring++){
      const rr=R*(ring/4);
      g.beginPath();
      angles.forEach((a,i)=>{
        const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
        if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
      });
      g.closePath();
      g.strokeStyle='rgba(255,255,255,.10)';
      g.stroke();
    }

    angles.forEach(a=>{
      g.beginPath();
      g.moveTo(cx,cy);
      g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
      g.strokeStyle='rgba(255,255,255,.09)';
      g.stroke();
    });

    g.beginPath();
    values.forEach((v,i)=>{
      const a=angles[i], rr=R*v;
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    });
    g.closePath();
    g.fillStyle='rgba(167,93,255,.28)';
    g.strokeStyle='rgba(190,120,255,.95)';
    g.lineWidth=2;
    g.fill();
    g.stroke();

    values.forEach((v,i)=>{
      const a=angles[i], rr=R*v;
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
      g.beginPath();
      g.arc(x,y,3.5,0,Math.PI*2);
      g.fillStyle='rgba(235,220,255,1)';
      g.fill();
    });

    g.textAlign='center';
    g.fillStyle='rgba(235,240,250,.92)';
    g.font='11px Inter, system-ui, sans-serif';
    labels.forEach((label,i)=>{
      const a=angles[i];
      const rr=R+30;
      const x=cx+Math.cos(a)*rr;
      const y=cy+Math.sin(a)*rr;
      g.fillText(label,x,y);
      g.fillStyle='rgba(160,170,190,.95)';
      g.font='10px Inter, system-ui, sans-serif';
      g.fillText(raw[i].toFixed(2),x,y+14);
      g.fillStyle='rgba(235,240,250,.92)';
      g.font='11px Inter, system-ui, sans-serif';
    });
  }

  function reset(){
    creatures=[]; foods=[]; particles=[]; predators=[];
    flowEvent.active=false;
    flowEvent.timer=0;
    flowEvent.duration=0;
    flowEvent.cooldown=rand(1500,2600);
    mutationCount=0; maxGeneration=0;
    for(let i=0;i<30;i++) creatures.push(makeCreature());
    for(let i=0;i<95;i++) addFood(rand(W),rand(H));
  }

  function nearestFood(c){
    let best=null,bd=Infinity;

    for(const f of foods){
      const dx=f.x-c.x,dy=f.y-c.y,d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=f}
    }
    return best;
  }



  function startWaterFlowEvent(){
    flowEvent.active=true;
    flowEvent.timer=0;
    flowEvent.duration=rand(520,900);
    flowEvent.angle=choice([
      0,
      Math.PI,
      Math.PI*.18,
      Math.PI*.82,
      Math.PI*1.18,
      Math.PI*1.82
    ]);
    flowEvent.strength=rand(.052,.078);
    flowEvent.cooldown=rand(1700,2900);

    const toast=document.getElementById('captureToast');
    if(toast){
      toast.textContent='STRONG WATER FLOW';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),1200);
    }
  }

  function updateWaterFlow(dt){
    if(!flowEvent.active){
      flowEvent.cooldown-=dt;
      if(flowEvent.cooldown<=0) startWaterFlowEvent();
      return;
    }

    flowEvent.timer+=dt;
    const progress=clamp(flowEvent.timer/flowEvent.duration,0,1);
    const envelope=Math.sin(progress*Math.PI);
    const fx=Math.cos(flowEvent.angle)*flowEvent.strength*envelope;
    const fy=Math.sin(flowEvent.angle)*flowEvent.strength*envelope;

    // Strong flow scatters all lifeforms.
    for(const c of creatures.slice()){
      c.vx += fx*dt*(2.2+Math.random()*1.8);
      c.vy += fy*dt*(2.2+Math.random()*1.8);

      // Violent turbulence: strong lateral dispersion + rotational agitation.
      const turbulence=(Math.random()-.5)*.045*envelope;
      const swirl=Math.sin((c.x+c.y)*.022 + time*.12)*.032*envelope;
      c.vx += (-Math.sin(flowEvent.angle)*turbulence + Math.cos(c.phaseA)*swirl)*dt;
      c.vy += ( Math.cos(flowEvent.angle)*turbulence + Math.sin(c.phaseB)*swirl)*dt;

      // Random agitation breaks coherent colonies apart.
      c.vx += (Math.random()-.5)*.040*envelope*dt;
      c.vy += (Math.random()-.5)*.040*envelope*dt;
      c.angle += (Math.random()-.5)*.16*envelope*dt;

      // Morphological resistance.
      const social=clamp((c.gene.sociability-1)/4,0,1);
      const curiosity=clamp((c.gene.curiosity-1)/4,0,1);
      const resistance=.18 + social*.22 + curiosity*.08;

      // Colony density must be calculated BEFORE it is used.
      let nearbyCount=0;
      for(const o of creatures){
        if(o===c) continue;
        if(Math.hypot(o.x-c.x,o.y-c.y)<95) nearbyCount++;
      }
      const colonyShear=clamp(nearbyCount/6,0,1.8);

      // Clustered lifeforms are torn apart by differential flow.
      if(nearbyCount>=3 && progress>.20 && progress<.85 && Math.random()<.020*dt){
        const tear=rand(.35,.95)*(1+colonyShear*.45)*envelope;
        const a=Math.random()*Math.PI*2;
        c.vx += Math.cos(a)*tear;
        c.vy += Math.sin(a)*tear;
      }

      // Short violent impulses at peak flow.
      if(progress>.28 && progress<.78 && Math.random()<.025*dt){
        const impulse=rand(.45,1.25)*envelope;
        c.vx += (Math.random()-.5)*impulse;
        c.vy += (Math.random()-.5)*impulse;
      }

      // Peak turbulence can shear off extra blocks.
      if(progress>.24 && progress<.80 && c.gene.blocks.length>3 &&
         Math.random()<(.0048*(1-resistance*.36)*(1+colonyShear*.9))*dt){
        const extraIdx=(Math.random()*c.gene.blocks.length)|0;
        const extra=c.gene.blocks.splice(extraIdx,1)[0];
        refreshTraits(c.gene);
        c.energy=Math.max(3,c.energy-rand(6,13));
        burst(c.x,c.y,extra?.color||[180,190,205],10);
      }

      // Peak flow can shear off several elements in succession.
      if(progress>.34 && progress<.72 && c.gene.blocks.length>4 &&
         Math.random()<(.0042*(1-resistance*.30)*(1+colonyShear*1.15))*dt){
        const shearCount=Math.min(c.gene.blocks.length-2,1+((Math.random()*3)|0));
        for(let si=0;si<shearCount;si++){
          if(c.gene.blocks.length<=2) break;
          const ridx=(Math.random()*c.gene.blocks.length)|0;
          const part=c.gene.blocks.splice(ridx,1)[0];
          burst(
            c.x+(Math.random()-.5)*18,
            c.y+(Math.random()-.5)*18,
            part?.color||[170,180,195],
            9
          );
        }
        refreshTraits(c.gene);
        c.energy=Math.max(2,c.energy-rand(12,24));
      }

      // Main fragmentation pulse.
      if(progress>.10 && progress<.92 &&
         Math.random()<(.0068*(1-resistance*.42)*(1+colonyShear*.75))*dt){
        if(c.gene.blocks.length>2){
          const idx=(Math.random()*c.gene.blocks.length)|0;
          const removed=c.gene.blocks.splice(idx,1)[0];
          refreshTraits(c.gene);
          c.energy=Math.max(3,c.energy-rand(8,16));
          burst(c.x,c.y,removed?.color||[180,190,205],14);
        }else if(Math.random()<.68*(1-resistance*.45)){
          const ci=creatures.indexOf(c);
          if(ci>=0){
            burst(c.x,c.y,[150,160,175],20);
            creatures.splice(ci,1);
          }
        }
      }
    }

    // Food and predators are also dispersed.
    for(const f of foods){
      f.x += fx*dt*24;
      f.y += fy*dt*24;
    }
    for(const p of predators){
      p.vx += fx*dt*1.05;
      p.vy += fy*dt*1.05;
    }

    if(flowEvent.timer>=flowEvent.duration){
      flowEvent.active=false;
      flowEvent.timer=0;
    }
  }

  function drawWaterFlow(){
    if(!flowEvent.active) return;
    const progress=clamp(flowEvent.timer/flowEvent.duration,0,1);
    const envelope=Math.sin(progress*Math.PI);
    ctx.save();
    ctx.globalAlpha=.20+.28*envelope;
    ctx.strokeStyle='rgba(220,235,255,.88)';
    ctx.lineWidth=2.2;

    const dx=Math.cos(flowEvent.angle), dy=Math.sin(flowEvent.angle);
    const px=-dy, py=dx;

    const spacing=88;
    const length=Math.max(W,H)*1.25;
    const count=Math.ceil((Math.abs(px)*W+Math.abs(py)*H)/spacing)+8;

    for(let i=-count;i<=count;i++){
      const ox=W/2 + px*i*spacing - dx*length/2;
      const oy=H/2 + py*i*spacing - dy*length/2;
      ctx.beginPath();
      for(let s=0;s<=9;s++){
        const t=s/9;
        const wave=Math.sin(t*22 + time*.095 + i)*22*envelope;
        const x=ox+dx*length*t+px*wave;
        const y=oy+dy*length*t+py*wave;
        if(s===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function makePredator(x=null,y=null){
    const edge=(Math.random()*4)|0;
    if(x==null || y==null){
      if(edge===0){x=-40;y=rand(H);}
      else if(edge===1){x=W+40;y=rand(H);}
      else if(edge===2){x=rand(W);y=-40;}
      else{x=rand(W);y=H+40;}
    }
    return {
      x,y,
      vx:rand(-.35,.35),vy:rand(-.35,.35),
      angle:rand(Math.PI*2),
      hp:100,
      size:rand(22,32),
      attackCooldown:0,
      age:0,
      phase:rand(Math.PI*2),
      dismantled:0
    };
  }

  function nearbyDefenders(target, radius=105){
    const list=[];
    for(const c of creatures){
      const d=Math.hypot(c.x-target.x,c.y-target.y);
      if(d<radius) list.push(c);
    }
    return list;
  }

  function colonyDefenseScore(target){
    const defenders=nearbyDefenders(target,110);
    if(defenders.length<4) return {active:false,score:0,defenders,avg:0};
    const avg=defenders.reduce((s,c)=>s+(c.gene?.sociability||0),0)/defenders.length;
    // High sociability + enough members creates a defensive colony.
    const score=avg*(defenders.length/4);
    return {active:avg>=2.9 && score>=3.2,score,defenders,avg};
  }

  function dismantleCreature(c,p){
    if(!c || !c.gene || !c.gene.blocks) return;

    if(c.gene.blocks.length>2){
      const idx=(Math.random()*c.gene.blocks.length)|0;
      const removed=c.gene.blocks.splice(idx,1)[0];
      refreshTraits(c.gene);
      c.energy=Math.max(4,c.energy-18);
      p.dismantled++;
      burst(c.x,c.y,removed?.color||[110,90,94],16);
    }else{
      const idx=creatures.indexOf(c);
      if(idx>=0){
        burst(c.x,c.y,[95,78,82],28);
        creatures.splice(idx,1);
        p.dismantled+=2;
      }
    }
  }

  function updatePredator(p,dt){
    p.age+=dt;
    p.phase+=.026*dt;
    p.attackCooldown-=dt;

    let target=null,bd=Infinity;
    for(const c of creatures){
      const d2=(c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);
      if(d2<bd){bd=d2;target=c;}
    }

    if(target){
      const dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy)||1;
      const hunt=.0105;
      p.vx+=dx/d*hunt*dt;
      p.vy+=dy/d*hunt*dt;

      // Colony defense activates around the threatened target.
      const defense=colonyDefenseScore(target);
      if(defense.active && d<145){
        const repel=clamp(defense.score*.006,0,.025);
        p.vx-=dx/d*repel*dt;
        p.vy-=dy/d*repel*dt;
        p.hp-=defense.score*.055*dt;

        // Defenders turn toward and pressure the predator.
        for(const c of defense.defenders){
          const ax=p.x-c.x, ay=p.y-c.y, ad=Math.hypot(ax,ay)||1;
          c.vx+=ax/ad*.0024*(.4+((c.gene.sociability-1)/4)*1.6)*dt;
          c.vy+=ay/ad*.0024*(.4+((c.gene.sociability-1)/4)*1.6)*dt;
          if(Math.random()<.025*dt) burst(p.x,p.y,[88,244,171],2);
        }
      }

      if(d<p.size+18 && p.attackCooldown<=0){
        if(!defense.active){
          dismantleCreature(target,p);
          p.hp=Math.min(120,p.hp+4);
          p.size=Math.min(42,p.size+.45);
          p.attackCooldown=70;
        }else{
          p.hp-=10+defense.score*5;
          p.attackCooldown=45;
          burst(p.x,p.y,[88,244,171],18);
        }
      }
    }

    // erratic predator motion
    p.vx+=Math.cos(p.phase*1.7)*.0018*dt;
    p.vy+=Math.sin(p.phase*1.3)*.0018*dt;

    const maxV=1.55;
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>maxV){p.vx=p.vx/sp*maxV;p.vy=p.vy/sp*maxV;}
    p.vx*=.994;p.vy*=.994;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.angle=Math.atan2(p.vy,p.vx);

    // predators can leave, but are more likely to persist if they have dismantled life
    const margin=160;
    if(p.x<-margin||p.x>W+margin||p.y<-margin||p.y>H+margin) p.hp-=.5*dt;
  }

  function drawPredator(p){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.angle);
    const pulse=1+Math.sin(p.phase)*.12;
    ctx.scale(pulse,2-pulse);

    ctx.globalCompositeOperation='source-over';

    // Outer fractured shell
    const grad=ctx.createRadialGradient(0,0,2,0,0,p.size*1.5);
    grad.addColorStop(0,'rgba(95,70,74,.20)');
    grad.addColorStop(.55,'rgba(38,30,32,.28)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,p.size*1.5,0,Math.PI*2);
    ctx.fill();

    // black core
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(7,7,9,.98)';
    ctx.strokeStyle='rgba(110,85,88,.62)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    const sides=7;
    for(let i=0;i<sides;i++){
      const a=Math.PI*2*i/sides;
      const rr=p.size*(i%2?0.72:1);
      const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.fill();ctx.stroke();

    // dismantling blades
    ctx.strokeStyle='rgba(105,82,86,.50)';
    ctx.lineWidth=1.2;
    for(let i=0;i<5;i++){
      const a=Math.PI*2*i/5+p.phase*.22;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*p.size*.55,Math.sin(a)*p.size*.55);
      ctx.lineTo(Math.cos(a)*p.size*1.35,Math.sin(a)*p.size*1.35);
      ctx.stroke();
    }

    // HP ring
    ctx.strokeStyle='rgba(255,255,255,.16)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,p.size*1.65,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(120,132,126,.46)';
    ctx.beginPath();
    ctx.arc(0,0,p.size*1.65,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p.hp/100,0,1));
    ctx.stroke();

    ctx.restore();
  }

  function updateCreature(c,dt){
    c.age += dt;
    c.cooldown -= dt;
    c.pulse += .018*dt;
    c.energy -= .0045*dt*c.gene.metabolism*(1+c.gene.blocks.length*.035);

    const f=nearestFood(c);
    if(f){
      const dx=f.x-c.x,dy=f.y-c.y,d=Math.hypot(dx,dy)||1;
      const pull=.006*c.gene.curiosity*c.gene.speed;
      c.vx += dx/d*pull*dt;
      c.vy += dy/d*pull*dt;
      if(d<15+Math.sqrt(c.gene.blocks.length)*4){
        const idx=foods.indexOf(f);
        if(idx>=0) foods.splice(idx,1);
        c.energy=Math.min(150,c.energy+rand(12,20));
        burst(f.x,f.y,choice(palette));
        if(Math.random()<.12) c.gene=mutateGene(c.gene,.45);
      }
    }

    // social attraction / repulsion
    for(const o of creatures){
      if(o===c) continue;
      const dx=o.x-c.x,dy=o.y-c.y,d2=dx*dx+dy*dy;
      if(d2<140*140){
        const d=Math.sqrt(d2)||1;
        if(d<24){ c.vx-=dx/d*.008*dt; c.vy-=dy/d*.008*dt; }
        else if(d<100){ c.vx+=dx/d*.0013*c.gene.sociability*dt; c.vy+=dy/d*.0013*c.gene.sociability*dt; }
      }
    }

    // subtle water drift
    c.vx += Math.sin((c.y+time*.02)*.006)*.00055*dt;
    c.vy += Math.cos((c.x-time*.018)*.005)*.00045*dt;

    // Motion evolves with generation:
    // early generations drift simply, later ones acquire meander, orbit, pulse and burst behavior.
    const evo = clamp(c.generation/36,0,1);
    const phase = c.generation/6;
    c.phaseA += (.010 + evo*.018) * dt;
    c.phaseB += (.006 + evo*.013) * dt;

    // meandering force
    if(c.generation>=4){
      c.vx += Math.cos(c.phaseA + c.wobbleSeed)*.0028*evo*dt;
      c.vy += Math.sin(c.phaseA*1.17 + c.wobbleSeed)*.0028*evo*dt;
    }

    // lateral swimming / S-curve
    if(c.generation>=8){
      const sp0=Math.hypot(c.vx,c.vy)||1;
      const nx=-c.vy/sp0, ny=c.vx/sp0;
      const lateral=Math.sin(c.phaseB*1.8 + phase)*.0055*evo;
      c.vx += nx*lateral*dt;
      c.vy += ny*lateral*dt;
    }

    // slow orbital tendency around nearby conspecifics
    if(c.generation>=16){
      let near=null, nd=Infinity;
      for(const o of creatures){
        if(o===c) continue;
        const dx=o.x-c.x,dy=o.y-c.y,d2=dx*dx+dy*dy;
        if(d2<nd && d2<110*110){ nd=d2; near=o; }
      }
      if(near){
        const dx=near.x-c.x,dy=near.y-c.y,d=Math.hypot(dx,dy)||1;
        const orbit=.0035*evo;
        c.vx += (-dy/d)*orbit*dt;
        c.vy += ( dx/d)*orbit*dt;
      }
    }

    // high-generation burst / contraction rhythm
    if(c.generation>=24){
      const burst=Math.max(0,Math.sin(c.phaseA*.63 + c.phaseB*.41));
      const boost=burst*burst*.0065*evo;
      const a=Math.atan2(c.vy,c.vx)+Math.sin(c.phaseB)*.45;
      c.vx += Math.cos(a)*boost*dt;
      c.vy += Math.sin(a)*boost*dt;
    }

    if(pointer.down){
      const dx=c.x-pointer.x,dy=c.y-pointer.y,d=Math.hypot(dx,dy);
      if(d<190){
        const k=(1-d/190)*.015;
        c.vx += pointer.vx*k*dt;
        c.vy += pointer.vy*k*dt;
      }
    }

    const speedFactor=.55 + ((c.gene.speed-1)/4)*1.45;
    const maxV=(1.25 + evo*.85)*speedFactor;
    const sp=Math.hypot(c.vx,c.vy);
    if(sp>maxV){c.vx=c.vx/sp*maxV;c.vy=c.vy/sp*maxV}
    c.vx*=.996; c.vy*=.996;
    c.x+=c.vx*dt; c.y+=c.vy*dt;
    c.angle=Math.atan2(c.vy,c.vx)+Math.sin(c.pulse)*.15;

    const pad=34;
    if(c.x<-pad)c.x=W+pad; if(c.x>W+pad)c.x=-pad;
    if(c.y<-pad)c.y=H+pad; if(c.y>H+pad)c.y=-pad;

    // reproduction
    if(c.energy>112 && c.cooldown<=0 && creatures.length<70){
      // Early generations reproduce/merge less frequently.
      // GEN 0-5: 35% of the normal reproduction rate.
      const reproductionRate = c.generation<=5 ? .0012*0.35 : .0012;
      if(Math.random()<reproductionRate*dt){
        const candidates=creatures.filter(o=>o!==c && o.energy>80 && Math.hypot(o.x-c.x,o.y-c.y)<90 && o.cooldown<=0);
        const crossoverChance = c.generation<=5 ? .28 : .58;
        if(candidates.length && Math.random()<crossoverChance){
          const o=choice(candidates);
          const g=crossGenes(c.gene,o.gene);
          const gen=Math.max(c.generation,o.generation)+1;
          creatures.push(makeCreature((c.x+o.x)/2,(c.y+o.y)/2,g,gen));
          c.energy-=28; o.energy-=22; c.cooldown=o.cooldown=420;
          maxGeneration=Math.max(maxGeneration,gen);
          burst((c.x+o.x)/2,(c.y+o.y)/2,[255,255,255],22);
        }else{
          const g=mutateGene(c.gene,.9);
          const gen=c.generation+1;
          creatures.push(makeCreature(c.x+rand(-14,14),c.y+rand(-14,14),g,gen));
          c.energy-=34; c.cooldown=480; maxGeneration=Math.max(maxGeneration,gen);
          burst(c.x,c.y,[255,255,255],18);
        }
      }
    }
  }

  function burst(x,y,color,n=10){
    for(let i=0;i<n;i++) particles.push({
      x,y,vx:rand(-1.6,1.6),vy:rand(-1.6,1.6),life:1,
      color:color.slice(),r:rand(1,3)
    });
  }

  function drawBlock(b, generation=0, phase=0, index=0){
    ctx.save();

    // GEN 0–5: rigid / opaque / fixed
    // GEN 6–10: organic deformation / gradient
    // GEN 11+: translucent overlays / increasingly crystalline order
    const organic = clamp((generation-5)/5,0,1);
    const crystal = clamp((generation-10)/24,0,1);

    let px=b.x, py=b.y, rot=b.r||0;
    let stretchX=1, stretchY=1;

    if(generation>=4){
      px += Math.sin(phase*.78 + index*.91)*organic*2.2;
      py += Math.cos(phase*.71 + index*.63)*organic*2.2;
      rot += Math.sin(phase*.62 + index)*organic*.12;
      stretchX = 1 + Math.sin(phase + index*.7)*(.10 + organic*.16);
      stretchY = 1 + Math.cos(phase*1.14 + index*.52)*(.07 + organic*.12);
    }

    if(generation>=9){
      const step=Math.PI/3;
      const a=Math.atan2(py,px);
      const rr=Math.hypot(px,py);
      const snappedA=Math.round(a/step)*step;
      const snappedR=Math.round(rr/12)*12;
      const blend=crystal*.78;

      px=px*(1-blend)+Math.cos(snappedA)*snappedR*blend;
      py=py*(1-blend)+Math.sin(snappedA)*snappedR*blend;
      rot=rot*(1-crystal*.7)+snappedA*crystal*.7;
      stretchX=stretchX*(1-crystal*.7)+1*(crystal*.7);
      stretchY=stretchY*(1-crystal*.7)+1*(crystal*.7);
    }

    ctx.translate(px,py);
    ctx.rotate(rot);
    ctx.scale(stretchX,stretchY);

    const [r,g,bl]=b.color||[255,255,255];
    const alt=palette[(Math.abs(Math.floor((b.x||0)+(b.y||0)+(b.s||0)))+index)%palette.length];
    const s=b.s||8;

    if(generation<=5){
      ctx.globalAlpha=1;
      ctx.fillStyle=`rgb(${r},${g},${bl})`;
      ctx.strokeStyle=`rgb(${r},${g},${bl})`;
    }else if(generation<=10){
      const grad=ctx.createLinearGradient(-s*1.4,-s,s*1.4,s);
      grad.addColorStop(0,`rgba(${r},${g},${bl},1)`);
      grad.addColorStop(.5,`rgba(${Math.round((r+alt[0])/2)},${Math.round((g+alt[1])/2)},${Math.round((bl+alt[2])/2)},.96)`);
      grad.addColorStop(1,`rgba(${alt[0]},${alt[1]},${alt[2]},.9)`);
      ctx.fillStyle=grad;
      ctx.strokeStyle=`rgba(${r},${g},${bl},.95)`;
      ctx.globalAlpha=.96;
    }else{
      const grad=ctx.createLinearGradient(-s*1.6,-s*1.2,s*1.6,s*1.2);
      grad.addColorStop(0,`rgba(${r},${g},${bl},${.52+crystal*.12})`);
      grad.addColorStop(.48,`rgba(${alt[0]},${alt[1]},${alt[2]},${.38+crystal*.14})`);
      grad.addColorStop(1,`rgba(${r},${g},${bl},${.26+crystal*.14})`);
      ctx.fillStyle=grad;
      ctx.strokeStyle=`rgba(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,bl+40)},${.35+crystal*.4})`;
      ctx.globalAlpha=.72;
      ctx.globalCompositeOperation='screen';
    }

    ctx.lineWidth=1.2+crystal;

    const drawBaseShape=(scale=1)=>{
      const ss=s*scale;

      if(b.type==='circle'){
        if(generation>=9){
          const sides=6+Math.floor(crystal*6);
          ctx.beginPath();
          for(let i=0;i<sides;i++){
            const a=Math.PI*2*i/sides-Math.PI/2;
            const x=Math.cos(a)*ss, y=Math.sin(a)*ss;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }else{
          ctx.beginPath(); ctx.arc(0,0,ss,0,Math.PI*2); ctx.fill();
        }
      }else if(b.type==='square'){
        if(generation>=9){
          ctx.beginPath();
          ctx.moveTo(0,-ss*1.1); ctx.lineTo(ss,0); ctx.lineTo(0,ss*1.1); ctx.lineTo(-ss,0);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }else{
          ctx.fillRect(-ss,-ss,ss*2,ss*2);
        }
      }else if(b.type==='triangle'){
        const tip=generation>=4 ? ss*(1+Math.sin(phase*.92+index)*organic*.22) : ss;
        ctx.beginPath();
        ctx.moveTo(tip,0); ctx.lineTo(-ss*.75,ss*.75); ctx.lineTo(-ss*.75,-ss*.75);
        ctx.closePath(); ctx.fill();
        if(generation>=11) ctx.stroke();
      }else if(b.type==='line'){
        const ext=generation>=4 ? 1.25+Math.sin(phase+index)*organic*.32 : 1.25;
        ctx.lineWidth=Math.max(2,ss*.34);
        ctx.beginPath(); ctx.moveTo(-ss*ext,0); ctx.lineTo(ss*ext,0); ctx.stroke();
      }else{
        if(generation>=9){
          ctx.beginPath();
          for(let i=0;i<6;i++){
            const a=Math.PI*2*i/6;
            const rad=ss*(i%2===0?1.35:1.0);
            const x=Math.cos(a)*rad, y=Math.sin(a)*rad*.72;
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }else{
          ctx.beginPath(); ctx.ellipse(0,0,ss*1.35,ss*.72,0,0,Math.PI*2); ctx.fill();
        }
      }
    };

    drawBaseShape(1);

    if(generation>=9){
      const overlays=1+Math.floor(crystal*3);
      for(let k=1;k<=overlays;k++){
        ctx.save();
        ctx.globalAlpha=.11+crystal*.05;
        ctx.rotate((Math.PI/3)*k + phase*.025*(1-crystal));
        ctx.scale(1+k*.12,1+k*.12);
        drawBaseShape(1);
        ctx.restore();
      }

      if(crystal>.12){
        ctx.save();
        ctx.globalCompositeOperation='screen';
        ctx.globalAlpha=.18+crystal*.22;
        ctx.strokeStyle='rgba(255,255,255,.75)';
        ctx.lineWidth=.7+crystal*.7;
        for(let i=0;i<6;i++){
          const a=Math.PI*2*i/6;
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a)*s*(.7+crystal*.7),Math.sin(a)*s*(.7+crystal*.7));
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    ctx.restore();
  }

  function drawCreature(c){
    ctx.save();
    ctx.translate(c.x,c.y);

    const gen=c.generation||0;
    const organic=clamp((gen-3)/3,0,1);
    const crystal=clamp((gen-8)/20,0,1);
    const localPhase=c.pulse+c.phaseA*.7;

    let bodyRot=c.angle;
    if(gen>=4 && gen<=6){
      bodyRot+=Math.sin(localPhase*.7)*organic*.16;
    }else if(gen>=9){
      bodyRot+=Math.sin(localPhase*.5)*(1-crystal)*.12;
    }
    ctx.rotate(bodyRot);

    const baseScale=clamp(.78+c.energy/180,.78,1.45);
    let sx=baseScale, sy=baseScale;

    if(gen>=4 && gen<=6){
      const breath=1+Math.sin(localPhase*.9)*organic*.09;
      sx*=breath; sy*=(2-breath);
    }else if(gen>=9){
      const breath=1+Math.sin(localPhase*.75)*(1-crystal)*.06;
      sx*=breath; sy*=(2-breath);
    }
    ctx.scale(sx,sy);

    if(gen<=3){
      ctx.strokeStyle='rgba(255,255,255,.11)';
      ctx.lineWidth=1;
    }else if(gen<=6){
      ctx.strokeStyle='rgba(255,255,255,.14)';
      ctx.lineWidth=1.2;
    }else{
      ctx.strokeStyle=`rgba(220,235,255,${.14+crystal*.28})`;
      ctx.lineWidth=1.2+crystal*.9;
    }

    for(let i=1;i<c.gene.blocks.length;i++){
      const a=c.gene.blocks[i-1], b=c.gene.blocks[i];
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);

      if(gen<=3){
        ctx.lineTo(b.x,b.y);
      }else if(gen<=6){
        const mx=(a.x+b.x)/2+Math.sin(localPhase+i)*8*organic;
        const my=(a.y+b.y)/2+Math.cos(localPhase*.83+i)*8*organic;
        ctx.quadraticCurveTo(mx,my,b.x,b.y);
      }else{
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        const qx=Math.round(mx/12)*12, qy=Math.round(my/12)*12;
        const bx=mx*(1-crystal)+qx*crystal;
        const by=my*(1-crystal)+qy*crystal;
        ctx.lineTo(bx,by);
        ctx.lineTo(b.x,b.y);
      }
      ctx.stroke();
    }

    for(let i=0;i<c.gene.blocks.length;i++){
      drawBlock(c.gene.blocks[i],gen,localPhase+i*.47,i);
    }

    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=gen<=5?.035:gen<=10?.055:.07+crystal*.05;
    const haloRadius=16+Math.sqrt(c.gene.blocks.length)*(gen>=9?12:9);
    const halo=ctx.createRadialGradient(0,0,2,0,0,haloRadius);
    halo.addColorStop(0,'rgba(255,255,255,.55)');
    halo.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(0,0,haloRadius,0,Math.PI*2); ctx.fill();

    if(gen>=9 && crystal>.08){
      ctx.save();
      ctx.globalAlpha=.08+crystal*.08;
      ctx.strokeStyle='rgba(210,230,255,.85)';
      ctx.lineWidth=.7;
      const radius=18+Math.sqrt(c.gene.blocks.length)*10;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI*2*i/6-Math.PI/2;
        const x=Math.cos(a)*radius,y=Math.sin(a)*radius;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function draw(){
    ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);

    // soft water field
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'rgba(18,31,50,.28)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

    // faint currents
    ctx.strokeStyle='rgba(120,170,220,.035)';
    ctx.lineWidth=1;
    for(let y=60;y<H;y+=70){
      ctx.beginPath();
      for(let x=0;x<=W;x+=28){
        const yy=y+Math.sin(x*.012+time*.012+y*.01)*8;
        if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }

    // Strong-flow overlay is rendered once per frame.
    drawWaterFlow();

    for(const f of foods){
      ctx.globalAlpha=.65+.25*Math.sin(time*.05+f.x);
      ctx.fillStyle='rgba(240,248,255,.9)';
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    for(const c of creatures) drawCreature(c);
    for(const predator of predators) drawPredator(predator);

    for(const p of particles){
      ctx.globalAlpha=p.life;
      ctx.fillStyle=`rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    if(lassoActive && lassoPoints.length>1){
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,.9)';
      ctx.fillStyle='rgba(255,255,255,.06)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.moveTo(lassoPoints[0].x,lassoPoints[0].y);
      for(let i=1;i<lassoPoints.length;i++) ctx.lineTo(lassoPoints[i].x,lassoPoints[i].y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  function update(dt){
    time+=dt;
    if(Math.random()<.012*dt && foods.length<160) addFood(rand(W),rand(H),1);
    creatures.slice().forEach(c=>updateCreature(c,dt));
    updateWaterFlow(dt);

    // Predators emerge as the ecosystem matures.
    // Higher generation/population increases pressure, but total predators stay limited.
    const predatorCap=Math.min(7,2+Math.floor(maxGeneration/12));
    const spawnChance=(maxGeneration>=3 ? .00024 : .00007) * (1+Math.min(2.8,creatures.length/30));
    if(predators.length<predatorCap && Math.random()<spawnChance*dt){
      predators.push(makePredator());
    }

    predators.slice().forEach(p=>updatePredator(p,dt));
    for(let i=predators.length-1;i>=0;i--){
      const p=predators[i];
      if(p.hp<=0 || p.age>26000){
        burst(p.x,p.y,[88,244,171],30);
        predators.splice(i,1);
      }
    }

    // death / dissolution
    for(let i=creatures.length-1;i>=0;i--){
      const c=creatures[i];
      if(c.energy<=0 || c.age>22000+rand(0,12000)){
        burst(c.x,c.y,[180,200,230],12);
        creatures.splice(i,1);
      }
    }

    // keep ecosystem alive
    if(creatures.length<18){
      for(let i=creatures.length;i<24;i++) creatures.push(makeCreature(rand(W),rand(H),makeGene(),0));
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.98; p.vy*=.98; p.life-=.02*dt;
      if(p.life<=0) particles.splice(i,1);
    }
    if(particles.length>900) particles.splice(0,particles.length-900);

    document.getElementById('pop').textContent=creatures.length;
    document.getElementById('gen').textContent=maxGeneration;
    document.getElementById('food').textContent=foods.length;
    document.getElementById('mut').textContent=mutationCount;
    document.getElementById('phase').textContent=generationPhase(maxGeneration);
    document.getElementById('pred').textContent=predators.length;
    const fs=document.getElementById('flowStat');
    if(fs) fs.textContent=flowEvent.active?'STRONG':'CALM';
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(2.2,(now-last)/16.6667); last=now;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  function point(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left),y:(e.clientY-r.top)};
  }

  canvas.addEventListener('pointerdown',e=>{
    const p=point(e);

    if(lassoMode){
      lassoActive=true;
      lassoPoints=[p];
      pointer.down=false;
      canvas.setPointerCapture?.(e.pointerId);
      return;
    }

    const hit=findCreatureAt(p.x,p.y);
    if(hit){
      captureCreature(hit);
      pointer.down=false;
      return;
    }
    pointer.down=true;pointer.x=pointer.px=p.x;pointer.y=pointer.py=p.y;
    addFood(p.x,p.y,8);
    canvas.setPointerCapture?.(e.pointerId);
  });

  canvas.addEventListener('pointermove',e=>{
    const p=point(e);

    if(lassoMode && lassoActive){
      const last=lassoPoints[lassoPoints.length-1];
      if(!last || Math.hypot(p.x-last.x,p.y-last.y)>4) lassoPoints.push(p);
      return;
    }

    pointer.vx=p.x-pointer.x;pointer.vy=p.y-pointer.y;
    pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=p.x;pointer.y=p.y;
    if(pointer.down && Math.random()<.35) addFood(p.x,p.y,1);
  });

  canvas.addEventListener('pointerup',()=>{
    if(lassoMode && lassoActive){
      finishLassoCapture();
      return;
    }
    pointer.down=false;pointer.vx=pointer.vy=0;
  });

  canvas.addEventListener('pointercancel',()=>{
    if(lassoMode){lassoActive=false;lassoPoints=[];}
    pointer.down=false;
  });

  document.getElementById('feedBtn').onclick=()=>addFood(W*.5,H*.5,45);
  document.getElementById('burstBtn').onclick=()=>{
    const picks=creatures.slice().sort(()=>Math.random()-.5).slice(0,Math.max(1,Math.floor(creatures.length*.22)));
    for(const c of picks){ c.gene=mutateGene(c.gene,1.15); burst(c.x,c.y,choice(palette),8); }
  };
  document.getElementById('resetBtn').onclick=reset;


  // ---- Generative BGM: evolution state -> musical complexity ----
  let audioCtx=null, master=null, bgmTimer=null, bgmStep=0, bgmEnabled=false;
  let lastPop=0,lastGen=0,lastMut=0;

  const scales = [
    [0,2,5,7,9],          // pentatonic / simple
    [0,2,3,5,7,9,10],     // modal
    [0,2,3,5,7,8,10,11]   // denser chromatic/modal mix
  ];

  function midiToFreq(m){ return 440*Math.pow(2,(m-69)/12); }

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = bgmVolume;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value=-24; comp.knee.value=18; comp.ratio.value=5; comp.attack.value=.01; comp.release.value=.25;
    master.connect(comp).connect(audioCtx.destination);
  }

  function playTone(freq, dur=.18, amp=.05, type='sine', detune=0, pan=0){
    if(!audioCtx || !bgmEnabled) return;
    const now=audioCtx.currentTime;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const p=audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    o.type=type; o.frequency.value=freq; o.detune.value=detune;
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,amp),now+.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(g);
    if(p){ p.pan.value=clamp(pan,-1,1); g.connect(p).connect(master); }
    else g.connect(master);
    o.start(now); o.stop(now+dur+.04);
  }

  function noiseTick(amp=.02,dur=.04){
    if(!audioCtx || !bgmEnabled) return;
    const len=Math.floor(audioCtx.sampleRate*dur);
    const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const g=audioCtx.createGain(); g.gain.value=amp;
    const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
    src.connect(hp).connect(g).connect(master);
    src.start();
  }

  function getComplexity(){
    // Population and mutation saturate, but generation keeps evolving forever.
    // log growth prevents runaway density while still changing at every generation.
    const popN=clamp((creatures.length-18)/52,0,1);
    const mutN=clamp(mutationCount/90,0,1);
    const genFlow=1-Math.exp(-maxGeneration/18); // global complexity approaches 1 smoothly
    return clamp(popN*.24 + genFlow*.46 + mutN*.30,0,1);
  }

  function generationPhase(gen){
    // Musical phases are synchronized with the visual evolution stages.
    // 0: GEN 0–3 fixed / sparse
    // 1: GEN 4–6 organic / gradient
    // 2: GEN 7–8 transition / layering
    // 3+: GEN 9+ crystalline evolution, continuing without a hard maximum
    if(gen<=3) return 0;
    if(gen<=6) return 1;
    if(gen<=8) return 2;
    return 3 + Math.floor((gen-9)/6);
  }

  function bgmPulse(){
    if(!bgmEnabled || !audioCtx) return;
    const c=getComplexity();
    const pop=creatures.length, gen=maxGeneration, mut=mutationCount;
    const phase=generationPhase(gen);

    // Music follows the same evolutionary thresholds as the organism visuals.
    const visualStage = gen<=3 ? 0 : gen<=6 ? 1 : gen<=8 ? 2 : 3;

    // GEN 0–3: slow, sparse, fixed tonal material
    // GEN 4–6: slightly faster, more legato and organic
    // GEN 7–8: transitional layering
    // GEN 9+: crystalline repetition, layered harmony, expanding register
    const bpmBase=[48,62,76,88][visualStage];
    const bpm = bpmBase + (visualStage===3 ? Math.min(42,(gen-9)*1.25) : 0) + c*18;
    const beatMs=60000/bpm;

    const scaleBank=[
      [0,2,5,7,9],          // fixed pentatonic
      [0,2,3,5,7,9,10],     // organic modal
      [0,1,3,5,7,8,10],     // transitional
      [0,2,4,6,7,9,11],     // crystalline
      [0,1,4,5,7,8,11],
      [0,2,3,6,7,9,10,11]
    ];
    const scale = visualStage<3 ? scaleBank[visualStage] : scaleBank[3 + (phase%3)];

    const root = visualStage===0
      ? 43
      : 40 + ((phase*3 + Math.floor(gen/3))%16);

    const octaveSpan =
      visualStage===0 ? 1 :
      visualStage===1 ? 2 :
      visualStage===2 ? 3 :
      3 + Math.min(2,Math.floor((gen-9)/18));

    const density =
      visualStage===0 ? .24 :
      visualStage===1 ? .42 :
      visualStage===2 ? .58 :
      clamp(.68 + Math.min(.22,(gen-9)*.008),.68,.90);

    const meters =
      visualStage===0 ? [4] :
      visualStage===1 ? [4,5] :
      visualStage===2 ? [5,7] :
      [6,8,12,7];

    const meter=meters[phase%meters.length];

    // bass / organism pulse
    if(bgmStep%meter===0){
      const degree=scale[(Math.floor(bgmStep/meter)+gen)%scale.length];
      const bassType=visualStage===0?'sine':(visualStage===1?'sine':(visualStage===2?'triangle':(phase%2?'triangle':'sine')));
      playTone(midiToFreq(root+degree), .34+c*.18, .05, bassType, 0, -.25);
    }

    // primary melodic cells
    if(Math.random()<density){
      const degree=scale[(bgmStep + mut + phase + Math.floor(Math.random()*scale.length))%scale.length];
      const oct=Math.floor(Math.random()*(octaveSpan+1))*12;
      let note=root+12+degree+oct;

      // Later phases occasionally create larger evolutionary leaps.
      if(phase>=3 && Math.random()<Math.min(.32,phase*.018)) note += choice([-12,12,19,-5]);

      const type =
        visualStage===0 ? 'sine' :
        visualStage===1 ? (bgmStep%3===0?'triangle':'sine') :
        visualStage===2 ? 'triangle' :
        (phase%3===0?'triangle':(phase%3===1?'sine':'square'));
      playTone(midiToFreq(note), .09+c*.25, .026+c*.025, type, rand(-4-phase*.3,4+phase*.3), rand(-.75,.75));
    }

    // Population controls polyphony; later generations unlock additional ecosystem voices.
    const voices=1+Math.min(6,Math.floor(clamp((pop-22)/10,0,4))+Math.floor(phase/5));
    for(let v=1;v<voices;v++){
      const probability=clamp(.10+c*.22+(phase%3)*.035,0,.48);
      if(Math.random()<probability){
        const degree=choice(scale);
        const intervalPool=[5,7,10,12,14,17,19,24];
        const interval=intervalPool[(v+phase+gen)%intervalPool.length];
        playTone(
          midiToFreq(root+12+degree+interval),
          .07+c*.16,
          .010+Math.min(.012,phase*.0007),
          v%3===0?'square':'triangle',
          rand(-10,10),
          rand(-1,1)
        );
      }
    }

    // Crystalline arpeggio layer synchronized to GEN 9+ visual crystallization.
    if(visualStage===3){
      const crystalAmount=clamp((gen-8)/24,0,1);
      const arpDiv = crystalAmount>.65 ? 1 : 2;
      if(bgmStep%arpDiv===0){
        const seq=[0,2,4,1,5,3,6,2];
        const degree=scale[seq[bgmStep%seq.length] % scale.length];
        const octave = 24 + (bgmStep%4===3 ? 12 : 0);
        playTone(
          midiToFreq(root+octave+degree),
          .07 + crystalAmount*.08,
          .012 + crystalAmount*.012,
          'triangle',
          rand(-3,3),
          Math.sin(bgmStep*.9)*.72
        );
      }
      if(crystalAmount>.42 && bgmStep%6===0){
        const d1=scale[(bgmStep+phase)%scale.length];
        const d2=scale[(bgmStep+phase+2)%scale.length];
        playTone(midiToFreq(root+24+d1),.38,.010,'sine',0,-.28);
        playTone(midiToFreq(root+31+d2),.38,.010,'sine',0,.28);
      }
    }

    // Mutation controls irregular percussion and micro-instability.
    const mutActivity=clamp(mut/120,0,1);
    if(c>.18 && (bgmStep%2===0 || Math.random()<mutActivity*.5)) noiseTick(.005+c*.010,.02+.01*(phase%3));
    if(phase>=2 && Math.random()<.10+mutActivity*.25) noiseTick(.006+c*.010,.045+.01*(phase%4));

    // Long ecosystem tones become harmonically richer as generations rise.
    const droneDiv=[12,10,8,7,6][phase%5];
    if(bgmStep%droneDiv===0){
      const degree=scale[(gen+bgmStep+phase)%scale.length];
      playTone(midiToFreq(root+24+degree), .7+c*.8, .010+c*.014, 'sine', rand(-12-phase*.2,12+phase*.2), .25);
      if(phase>=4 && phase%2===0){
        const second=scale[(degree+2)%scale.length] ?? choice(scale);
        playTone(midiToFreq(root+31+second), .55+c*.55, .008+c*.010, 'triangle', rand(-8,8), -.25);
      }
    }

    // At the start of every new 8-generation phase, announce a new musical ecology.
    if(gen>lastGen){
      const newPhase=generationPhase(gen);
      const oldPhase=generationPhase(lastGen);
      if(newPhase>oldPhase){
        const chord=[0,7,12,choice(scale)+12];
        chord.forEach((iv,i)=>playTone(midiToFreq(root+24+iv), .8+i*.12, .026, i%2?'triangle':'sine',0,(i-1.5)*.25));
      }else{
        playTone(midiToFreq(root+30+scale[gen%scale.length]), .5, .026, 'sine', 0, 0);
      }
    }

    if(mut-lastMut>=5 && c>.22){
      playTone(midiToFreq(root+24+choice(scale)), .18, .020, 'triangle', rand(-18,18), rand(-.5,.5));
    }

    lastPop=pop; lastGen=gen; lastMut=mut;
    bgmStep++;

    // Phase also changes subdivision, so rhythm never permanently settles.
    const subdivisions=[2,2,3,2,4];
    const sub=subdivisions[phase%subdivisions.length];
    clearTimeout(bgmTimer);
    bgmTimer=setTimeout(bgmPulse, Math.max(90,beatMs/sub));
  }

  async function toggleBGM(){
    ensureAudio();
    if(audioCtx.state==='suspended') await audioCtx.resume();
    bgmEnabled=!bgmEnabled;
    document.getElementById('soundBtn').textContent=bgmEnabled?'STOP BGM':'START BGM';
    if(bgmEnabled){ bgmStep=0; bgmPulse(); }
    else if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; }
  }

  document.getElementById('soundBtn').onclick=toggleBGM;

  const uiToggle=document.getElementById('uiToggle');
  uiToggle.onclick=()=>{
    const panel=document.getElementById('ui');
    const hidden=panel.classList.toggle('ui-hidden');
    document.body.classList.toggle('ui-off',hidden);
    uiToggle.textContent=hidden?'SHOW UI':'HIDE UI';
  };

  document.getElementById('lassoModeBtn').onclick=()=>{
    lassoMode=!lassoMode;
    lassoActive=false;
    lassoPoints=[];
    const b=document.getElementById('lassoModeBtn');
    b.classList.toggle('active',lassoMode);
    b.textContent=lassoMode?'LASSO ON':'LASSO CAPTURE';
  };

  document.getElementById('collectionBtn').onclick=()=>{
    document.getElementById('collectionPanel').classList.toggle('open');
    updateCollectionUI();
  };

  document.getElementById('closeSpecimenModal').onclick=closeSpecimenModal;
  document.getElementById('specimenModal').addEventListener('pointerdown',(e)=>{
    if(e.target.id==='specimenModal') closeSpecimenModal();
  });
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape') closeSpecimenModal();
  });

  document.getElementById('closeCollection').onclick=()=>{
    document.getElementById('collectionPanel').classList.remove('open');
  };


  loadCollection();

  const bgmVolumeSlider=document.getElementById('bgmVolume');
  const bgmVolumeValue=document.getElementById('bgmVolumeValue');
  bgmVolumeSlider.addEventListener('input',()=>{
    bgmVolume=Number(bgmVolumeSlider.value)/100;
    bgmVolumeValue.textContent=bgmVolumeSlider.value;
    if(typeof master!=='undefined' && master && master.gain) master.gain.value=bgmVolume;
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
